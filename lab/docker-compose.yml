name: devops-local

networks:
  lab:
    external: false

services:
  app:
    build:
      context: ..
      dockerfile: lab/containerfile
    container_name: app
    restart: unless-stopped
    networks:
      - lab
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=devops
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:8.0
    container_name: mongo
    restart: unless-stopped
    networks:
      - lab
    ports:
      - "27017:27017"
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  simulator:
    build:
      context: ..
      dockerfile: lab/simulator.containerfile
    container_name: simulator
    restart: unless-stopped
    networks:
      - lab
    environment:
      - SIM_BASE_URL=http://app:3000
      - SIM_USERS=5
      - SIM_DELAY=0.2
      - SIM_INTERVAL=60
    depends_on:
      app:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - lab
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    networks:
      - lab
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  repository:
    image: gitea/gitea:1.27.3
    container_name: repository
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__SERVER__DOMAIN=localhost
      - GITEA__SERVER__HTTP_PORT=3000
      - GITEA__SERVER__ROOT_URL=http://localhost:8000/
      - GITEA__SERVER__SSH_DOMAIN=localhost
      - GITEA__SERVER__SSH_PORT=222
      - GITEA__SERVER__SSH_LISTEN_PORT=22
      - GITEA__ACTIONS__ENABLED=true
    networks:
      - lab
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone.ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8000:3000"
      - "222:22"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  pipeline:
    image: apache/airflow:3.3.2
    container_name: pipeline
    restart: always
    command: ["airflow", "standalone"]
    environment:
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin1234
    networks:
      - lab
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  gitea_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  mongo_data:
    driver: local